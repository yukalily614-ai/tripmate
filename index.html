<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripMate</title>
  
  <!-- CDN Links (CSS / Leaflet / Sortable) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=Cormorant+Garamond:wght@600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cdnjs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>

  <style>
    :root {
      --ink: #4A3B2E;
      --ink-soft: rgba(74, 59, 46, 0.55);
      --page-bg: #FBF2E4;
      --paper: #FFFFFF;
      --paper-2: #FBF1E3;
      --red: #E1795A;
      --teal: #4CA893;
      --gold: #E7B155;
      --gold-deep: #C98A2E;
      --sky: #7FADE0;
      --text-ink: #3A2E22;
      --line: rgba(74, 59, 46, 0.12);
      --radius: 16px;
      --shadow: 0 4px 16px rgba(74, 59, 46, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Zen Maru Gothic', 'Noto Sans JP', sans-serif;
      background-color: var(--page-bg);
      color: var(--text-ink);
      line-height: 1.6;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: var(--page-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 40px rgba(0,0,0,0.05);
    }

    header {
      padding: 24px 20px 16px;
      text-align: center;
      background: linear-gradient(180deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 100%);
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 38px;
      color: #385E48;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--ink-soft);
      letter-spacing: 0.5px;
    }

    .main-content {
      flex: 1;
      padding: 0 16px 80px;
    }

    .card {
      background: var(--paper);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--ink-soft);
    }

    input, textarea, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      background: #FAFAFA;
      color: var(--text-ink);
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: #385E48;
      background: #FFF;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 24px;
      background: #385E48;
      color: #FFF;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(56, 94, 72, 0.2);
      transition: all 0.2s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* Item List */
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 16px;
    }

    .item-card {
      background: var(--paper);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--line);
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }

    .item-info {
      flex: 1;
    }

    .item-time {
      font-size: 12px;
      font-weight: 700;
      color: var(--gold-deep);
    }

    .item-title {
      font-size: 15px;
      font-weight: 700;
      margin: 2px 0;
    }

    .item-memo {
      font-size: 12px;
      color: var(--ink-soft);
    }

    .btn-delete {
      background: none;
      border: none;
      color: #D9534F;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
    }

    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--ink-soft);
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>TripMate</h1>
    <div class="subtitle">旅も、おでかけも、もっと楽しく。</div>
  </header>

  <main class="main-content">
    <!-- 追加フォーム -->
    <div class="card">
      <div class="card-title">＋ 予定を追加</div>
      <form id="schedule-form">
        <div class="form-group">
          <label for="time">時間</label>
          <input type="time" id="time" required>
        </div>
        <div class="form-group">
          <label for="title">予定・スポット名</label>
          <input type="text" id="title" placeholder="例: 東京タワーに行く" required>
        </div>
        <div class="form-group">
          <label for="memo">メモ</label>
          <textarea id="memo" rows="2" placeholder="例: チケットの予約番号 1234"></textarea>
        </div>
        <button type="submit" class="btn">予定を保存する</button>
      </form>
    </div>

    <!-- 一覧表示 -->
    <div class="card">
      <div class="card-title">🗓️ 旅のスケジュール</div>
      <div id="schedule-list" class="item-list">
        <!-- ここにJSで動的に追加されます -->
      </div>
    </div>
  </main>
</div>

<script>
  // --- LocalStorageによる完全永続化ロジック ---
  const STORAGE_KEY = 'tripmate_schedules_v1';
  
  // 1. データの読み込み
  function loadSchedules() {
    try {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    } catch (e) {
      console.error('データの読み込みに失敗しました', e);
      return [];
    }
  }

  // 2. データの保存
  function saveSchedules(schedules) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(schedules));
    } catch (e) {
      console.error('データの保存に失敗しました', e);
    }
  }

  // 3. 画面レンダリング
  function renderSchedules() {
    const listContainer = document.getElementById('schedule-list');
    const schedules = loadSchedules();

    if (schedules.length === 0) {
      listContainer.innerHTML = '<div class="empty-state">まだ予定が登録されていません。<br>上のフォームから追加してみましょう！</div>';
      return;
    }

    // 時間順にソート
    schedules.sort((a, b) => (a.time > b.time ? 1 : -1));

    listContainer.innerHTML = schedules.map((item, index) => `
      <div class="item-card">
        <div class="item-info">
          <div class="item-time">${escapeHtml(item.time)}</div>
          <div class="item-title">${escapeHtml(item.title)}</div>
          ${item.memo ? `<div class="item-memo">${escapeHtml(item.memo)}</div>` : ''}
        </div>
        <button class="btn-delete" onclick="deleteSchedule(${index})" title="削除">🗑️</button>
      </div>
    `).join('');
  }

  // エスケープ処理（安全のため）
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // 4. 予定の追加処理
  document.getElementById('schedule-form').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const time = document.getElementById('time').value;
    const title = document.getElementById('title').value;
    const memo = document.getElementById('memo').value;

    const schedules = loadSchedules();
    schedules.push({ time, title, memo });
    
    saveSchedules(schedules);
    renderSchedules();

    // フォームリセット
    this.reset();
  });

  // 5. 予定の削除処理
  window.deleteSchedule = function(index) {
    if (confirm('この予定を削除しますか？')) {
      const schedules = loadSchedules();
      schedules.splice(index, 1);
      saveSchedules(schedules);
      renderSchedules();
    }
  };

  // 初期表示
  document.addEventListener('DOMContentLoaded', renderSchedules);
</script>

</body>
</html>
