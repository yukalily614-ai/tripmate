<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TripMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=Cormorant+Garamond:wght@600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
  :root{
    --ink:#4A3B2E;
    --ink-soft: rgba(74,59,46,0.55);
    --page-bg:#FBF2E4;
    --paper:#FFFFFF;
    --paper-2:#FBF1E3;
    --red:#E1795A;
    --teal:#4CA893;
    --gold:#E7B155;
    --gold-deep:#C98A2E;
    --sky:#7FADE0;
    --text-ink:#3A2E22;
    --line: rgba(74,59,46,0.13);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 12% 6%, rgba(231,177,85,0.16), transparent 42%),
      radial-gradient(circle at 90% 12%, rgba(127,173,224,0.14), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(76,168,147,0.14), transparent 45%),
      linear-gradient(165deg, #FFFBF4 0%, #FDF1E2 55%, #FCE9DA 100%);
    background-attachment: fixed;
    font-family:'Noto Sans JP', sans-serif;
    color: var(--ink);
    min-height:100vh;
  }
  .wrap{ max-width:480px; margin:0 auto; padding: 20px 16px 110px; }
  .clickable{ cursor:pointer; }

  /* ---- スプラッシュ ---- */
  .splash-screen{ background: linear-gradient(165deg, #FBF8F1 0%, #F5F1E6 45%, #ECF2EA 100%); min-height:100vh; display:flex; flex-direction:column; align-items:center; text-align:center; padding:52px 26px 40px; }
  .splash-badge{ width:110px; height:70px; margin-bottom:20px; }
  .splash-title{ font-family:'Cormorant Garamond', serif; font-weight:700; font-size:44px; color:#3E5A41; margin:0; letter-spacing:.01em; }
  .splash-tagline{ font-family:'Noto Sans JP', sans-serif; font-size:17px; color:#3E5A41; margin-top:14px; font-weight:500; }
  .splash-sub{ font-family:'Caveat', cursive; font-size:23px; color:#5E7F61; margin-top:4px; font-weight:600; }
  .splash-icons{ display:flex; justify-content:center; gap:10px; margin-top:36px; flex-wrap:nowrap; width:100%; }
  .splash-icon-item{ width:52px; display:flex; flex-direction:column; align-items:center; gap:8px; flex-shrink:0; }
  .splash-icon-circle{ width:50px; height:50px; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(62,90,65,0.08); }
  .splash-icon-circle svg{ width:21px; height:21px; }
  .splash-icon-item span{ font-family:'Noto Sans JP', sans-serif; font-size:10px; color:#3E5A41; font-weight:600; line-height:1.35; }
  .splash-landmarks{ width:100%; max-width:420px; margin-top:40px; }
  .splash-note{ font-family:'Caveat', cursive; font-size:20px; color:#3E5A41; margin-top:22px; line-height:1.5; }
  .splash-cta{ width:80%; max-width:320px; height:56px; margin-top:34px; background:#4F6F52; color:#FBF8F1; border:none; border-radius:28px; font-family:'Noto Sans JP', sans-serif; font-weight:700; font-size:16px; cursor:pointer; box-shadow:0 8px 24px rgba(79,111,82,0.28); }
  .splash-cta:active{ transform:translateY(1px); }

  /* ---- 旅一覧 ---- */
  .trip-card{ display:flex; align-items:center; gap:12px; background:var(--paper); border-radius:16px; padding:14px; margin-bottom:12px; box-shadow:0 5px 14px rgba(74,59,46,0.08); }
  .trip-card-badge{ width:48px; height:48px; border-radius:16px; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#F7D9B8,#BFE3DA); color:#8A5A2E; flex-shrink:0; }
  .trip-card-badge svg{ width:24px; height:24px; }
  .trip-card-info{ flex:1; min-width:0; }
  .trip-card-title{ font-weight:800; font-size:14.5px; color:var(--ink); font-family:'Zen Maru Gothic', sans-serif; }
  .trip-card-dates{ font-size:11px; color:var(--ink-soft); margin-top:3px; }
  .trip-card-chev{ color:var(--ink-soft); font-size:18px; }

  /* ---- ホーム ---- */
  .home-hero{ text-align:center; padding: 4px 6px 18px; }
  .hero-badge{ width:74px; height:74px; border-radius:26px; margin:0 auto 14px; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#F7D9B8,#BFE3DA); color:#8A5A2E; box-shadow:0 8px 20px rgba(74,59,46,0.16); transition: background .3s; }
  .home-hero.phase-during .hero-badge{ background:linear-gradient(135deg,#FFE1A0,#FFC7A8); }
  .home-hero.phase-during .countdown-pill{ color:#C97A2E; }
  .home-hero.phase-after .hero-badge{ background:linear-gradient(135deg,#E4D3F1,#D3C2E6); }
  .home-hero.phase-after .countdown-pill{ color:#8B5FA8; }
  .eyebrow{ font-family:'Zen Maru Gothic', sans-serif; font-weight:700; font-size:11px; letter-spacing:.14em; color: var(--gold-deep); text-transform:uppercase; margin-bottom:10px; }
  h1.title{ font-family:'Zen Maru Gothic', sans-serif; font-weight:900; font-size: 24px; line-height:1.4; margin: 0 0 8px; color: var(--ink); }
  .title .accent{ color: var(--gold-deep); }
  .dates{ font-family:'Zen Maru Gothic', sans-serif; font-weight:500; font-size:12.5px; color: var(--ink-soft); letter-spacing:.02em; }
  .countdown-pill{ display:inline-block; margin-top:14px; background: var(--paper); color: var(--red); font-weight:800; font-family:'Zen Maru Gothic', sans-serif; padding:9px 22px; border-radius:999px; font-size:13px; box-shadow:0 5px 12px rgba(74,59,46,0.1); cursor:default; }
  .countdown-pill.clickable{ cursor:pointer; }
  .countdown-sub{ font-size:11px; font-weight:600; margin-top:2px; }
  .home-card{ background: var(--paper); border-radius:18px; padding:15px 16px 16px; margin-bottom:14px; box-shadow:0 6px 16px rgba(74,59,46,0.08); }
  .home-card-head{ display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:13.5px; color: var(--ink); margin-bottom:10px; font-family:'Zen Maru Gothic', sans-serif; }
  .link-btn{ background:none; border:none; color: var(--teal); font-weight:700; font-size:11.5px; cursor:pointer; font-family:inherit; }
  .mini-timeline{ display:flex; flex-direction:column; }
  .mini-row{ display:flex; align-items:center; gap:10px; padding:6px 0; position:relative; }
  .mini-row:not(:last-child)::after{ content:""; position:absolute; left:3px; top:23px; bottom:-7px; width:1.5px; background: var(--line); }
  .mini-dot{ width:7px; height:7px; border-radius:50%; background: var(--red); flex-shrink:0; z-index:1; }
  .mini-time{ font-family:'Zen Maru Gothic', sans-serif; font-size:11px; font-weight:700; color: var(--ink-soft); flex:0 0 40px; }
  .mini-title{ font-size:12.5px; font-weight:600; color: var(--text-ink); }
  .next-dest{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .next-name{ font-weight:700; font-size:13.5px; }
  .next-time{ font-size:11px; color: var(--ink-soft); margin-top:3px; }
  .nav-start-btn{ background: var(--teal); color:#fff; font-weight:800; font-size:11.5px; padding:9px 15px; border-radius:999px; text-decoration:none; white-space:nowrap; flex-shrink:0; }
  .quick-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:2px; }
  .quick-btn{ background: var(--paper); border:none; border-radius:16px; padding:16px 10px; display:flex; flex-direction:column; align-items:center; gap:6px; font-size:20px; font-weight:700; color: var(--ink); cursor:pointer; box-shadow:0 5px 12px rgba(74,59,46,0.07); font-family:'Zen Maru Gothic', sans-serif; }
  .quick-btn span{ font-size:11.5px; }

  /* ---- 共通スクリーン見出し ---- */
  .screen-title{ font-family:'Zen Maru Gothic', sans-serif; font-weight:800; font-size:18px; color: var(--ink); margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; }
  .seg-pills{ display:flex; gap:4px; background: var(--paper-2); padding:5px; border-radius:999px; margin-bottom:2px; overflow-x:auto; }
  .seg-btn{ flex:1; border:none; background:none; padding:9px 4px; border-radius:999px; font-size:10.8px; font-weight:700; color: var(--ink-soft); cursor:pointer; font-family:'Zen Maru Gothic', sans-serif; white-space:nowrap; }
  .seg-btn.active{ background: var(--paper); color: var(--red); box-shadow:0 3px 8px rgba(74,59,46,0.1); }

  /* ---- 旅程 ---- */
  .stamp-row{ display:flex; justify-content:center; gap:8px; margin-bottom:18px; }
  .stamp{ width:44px; height:44px; border-radius:50%; border:2px dashed rgba(74,59,46,0.25); display:flex; align-items:center; justify-content:center; font-family:'Zen Maru Gothic', sans-serif; font-weight:700; font-size:15px; color: rgba(74,59,46,0.4); transform: rotate(-4deg); transition: all .25s ease; cursor:pointer; background: rgba(255,255,255,0.5); }
  .stamp:nth-child(2){ transform: rotate(3deg); }
  .stamp:nth-child(3){ transform: rotate(-2deg); }
  .stamp:nth-child(4){ transform: rotate(4deg); }
  .stamp.active{ color: #fff; border-style: solid; }
  .stamp.active[data-c="red"]{ background: var(--red); border-color: var(--red); }
  .stamp.active[data-c="teal"]{ background: var(--teal); border-color: var(--teal); }
  .stamp.active[data-c="gold"]{ background: var(--gold); border-color: var(--gold); }
  .stamp.active[data-c="sky"]{ background: var(--sky); border-color: var(--sky); }

  .day-heading{ text-align:center; margin: 0 0 14px; }
  .day-heading .d-label{ font-family:'Zen Maru Gothic', sans-serif; font-weight:600; font-size:12px; letter-spacing:.1em; color: var(--ink-soft); }
  .day-heading .d-date{ font-family:'Zen Maru Gothic', sans-serif; font-weight:700; font-size:17px; color: var(--ink); margin-top: 2px; }
  .nav-tip{ background: rgba(231,177,85,0.14); border:1px solid rgba(231,177,85,0.35); color: var(--gold-deep); border-radius:12px; padding:10px 12px; margin-bottom:16px; font-size:12px; line-height:1.6; }

  .ticket-compact{ display:flex; align-items:flex-start; gap:9px; background: var(--paper); border-radius:14px; padding:11px 12px; margin-bottom:10px; box-shadow:0 4px 12px rgba(74,59,46,0.07); }
  .ticket-compact.done{ opacity:0.55; }
  .ticket-compact.done .tc-title{ text-decoration:line-through; }
  .drag-handle{ flex:0 0 16px; display:flex; align-items:center; justify-content:center; color: rgba(74,59,46,0.28); cursor:grab; touch-action:none; margin-top:8px; }
  .drag-handle:active{ cursor:grabbing; color: rgba(74,59,46,0.5); }
  .sortable-ghost{ opacity:0.35; }
  .sortable-chosen{ box-shadow:0 10px 24px rgba(74,59,46,0.2); }
  .tc-time{ flex:0 0 44px; font-family:'Zen Maru Gothic', sans-serif; font-weight:700; font-size:12px; color: var(--text-ink); margin-top:6px; display:flex; flex-direction:column; }
  .tc-time-end{ font-size:9.5px; color: var(--ink-soft); font-weight:500; }
  .tc-icon-btn{ background:none; border:none; padding:0; cursor:pointer; flex-shrink:0; border-radius:50%; margin-top:2px; }
  .tc-body{ flex:1; min-width:0; cursor:pointer; }
  .tc-title{ font-weight:700; font-size:13.5px; color: var(--text-ink); }
  .tc-note{ font-size:11px; color: var(--ink-soft); margin-top:1px; }
  .tc-chev{ color: var(--ink-soft); font-size:17px; flex-shrink:0; cursor:pointer; margin-top:6px; }

  .add-item-wrap{ margin-top:12px; }
  .add-item-btn{ display:block; width:100%; background: var(--red); color:#fff; border:none; border-radius:999px; padding:13px; font-weight:800; font-size:13.5px; cursor:pointer; font-family:'Zen Maru Gothic', sans-serif; box-shadow:0 6px 16px rgba(225,121,90,0.3); }
  .add-item-form{ display:flex; flex-direction:column; gap:8px; background: var(--paper); border-radius:14px; padding:14px; box-shadow:0 5px 12px rgba(74,59,46,0.08); }
  .add-item-form input, .add-item-form textarea{ border:1px solid var(--line); border-radius:9px; padding:8px 10px; font-size:13px; font-family:inherit; }
  .add-item-form textarea{ min-height:44px; resize:vertical; }
  .add-item-actions{ display:flex; gap:8px; justify-content:flex-end; }
  .add-item-cancel{ background:none; border:none; color: var(--ink-soft); font-weight:700; font-size:12.5px; cursor:pointer; padding:8px 10px; font-family:inherit; }
  .add-item-save{ background: var(--teal); color:#fff; border:none; border-radius:9px; padding:8px 16px; font-weight:700; font-size:12.5px; cursor:pointer; }

  /* ---- 詳細シート共通パーツ ---- */
  .t-icon-emoji{ font-size:19px; width:30px; height:30px; display:flex; align-items:center; justify-content:center; background: var(--paper-2); border-radius:50%; }
  .cat-badge{ display:inline-flex; align-items:center; justify-content:center; border-radius:50%; flex-shrink:0; }
  .risk{ display:inline-flex; align-items:center; gap:5px; margin-top:8px; background: rgba(225,121,90,0.12); color: #C05F3F; border: 1px solid rgba(225,121,90,0.3); padding: 5px 9px; border-radius: 10px; font-size:11.5px; font-weight:700; line-height:1.4; }
  .tip{ display:flex; align-items:flex-start; gap:5px; margin-top:8px; background: rgba(76,168,147,0.12); color: #2F7C69; border: 1px solid rgba(76,168,147,0.28); padding: 6px 9px; border-radius: 10px; font-size:11.5px; font-weight:600; line-height:1.5; }
  .drama{ display:flex; align-items:flex-start; gap:5px; margin-top:8px; background: rgba(231,177,85,0.16); color: #9A6A18; border: 1px solid rgba(231,177,85,0.4); padding: 6px 9px; border-radius: 10px; font-size:11.5px; font-weight:600; line-height:1.5; }
  .snack{ display:flex; align-items:flex-start; gap:5px; margin-top:8px; background: rgba(74,59,46,0.05); color: #5C4831; border: 1px solid rgba(74,59,46,0.14); padding: 6px 9px; border-radius: 10px; font-size:11.5px; font-weight:600; line-height:1.5; }
  .transit{ display:flex; align-items:flex-start; gap:5px; margin-top:8px; background: rgba(127,173,224,0.14); color: #3D6FA3; border: 1px solid rgba(127,173,224,0.3); padding: 6px 9px; border-radius: 10px; font-size:11.5px; font-weight:600; line-height:1.5; }
  .map-links{ display:flex; gap:6px; margin-top:8px; }
  .map-link{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; text-decoration:none; padding: 5px 10px; border-radius: 999px; border:1px solid var(--line); color: var(--text-ink); background: var(--paper-2); }
  .map-link.naver{ color:#03824A; border-color:rgba(3,130,74,0.3); background:rgba(3,130,74,0.08); }
  .map-link.kakao{ color:#7A5E12; border-color:rgba(255,224,0,0.5); background:rgba(255,224,0,0.22); }
  .map-link.uber{ color:#FFFFFF; border-color:#000; background:#000; }
  .note-toggle{ font-size:12.5px; color: var(--teal); font-weight:700; cursor:pointer; background:none; border:none; padding:0; font-family: inherit; }
  .note-toggle.danger{ color: var(--red); }
  textarea.memo{ width:100%; border-radius:10px; border:1px solid var(--line); background: var(--paper-2); font-family:'Noto Sans JP', sans-serif; font-size:12.5px; padding:8px; resize:vertical; min-height:60px; color: var(--text-ink); }
  .edit-title{ width:100%; border-radius:8px; border:1px solid var(--line); padding:8px 9px; font-size:13.5px; font-family:inherit; }
  .edit-note{ width:100%; border-radius:8px; border:1px solid var(--line); padding:8px 9px; font-size:12.5px; font-family:inherit; min-height:44px; resize:vertical; }
  .time-input{ font-family:'Zen Maru Gothic', sans-serif; font-size:12px; border:1px solid var(--line); border-radius:7px; padding:5px 6px; width:fit-content; }
  .t-sep{ font-size:11px; color: var(--ink-soft); margin:0 4px; }
  .detail-field{ width:100%; border-radius:9px; border:1px solid var(--line); padding:8px 10px; font-size:12.5px; font-family:'Noto Sans JP', sans-serif; }
  .lookup-btn{ background: var(--teal); color:#fff; border:none; border-radius:10px; padding:9px 14px; font-weight:700; font-size:12.5px; cursor:pointer; font-family:'Zen Maru Gothic', sans-serif; align-self:flex-start; }
  .lookup-btn:disabled{ opacity:0.6; cursor:default; }
  .lookup-status{ font-size:11px; color: var(--ink-soft); }
  .detail-photos{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch; }
  .detail-photo-item{ position:relative; flex:0 0 auto; width:88px; height:88px; border-radius:12px; overflow:hidden; box-shadow:0 3px 8px rgba(74,59,46,0.1); }
  .detail-photo-item img{ width:100%; height:100%; object-fit:cover; display:block; cursor:pointer; }
  .photo-del{ position:absolute; top:3px; right:3px; background:rgba(0,0,0,0.55); color:#fff; border:none; border-radius:50%; width:20px; height:20px; font-size:11px; cursor:pointer; line-height:1; }
  .photo-add-btn{ flex:0 0 auto; width:88px; height:88px; border-radius:12px; border:2px dashed var(--line); display:flex; align-items:center; justify-content:center; font-size:24px; color: var(--ink-soft); cursor:pointer; background: var(--paper-2); }
  .cat-picker{ display:none; grid-template-columns:repeat(4,1fr); gap:10px 6px; margin-top:10px; background: var(--paper-2); border-radius:12px; padding:10px 8px; }
  .cat-opt{ display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; cursor:pointer; font-size:9.5px; color: var(--text-ink); font-family:'Noto Sans JP', sans-serif; padding:2px; }
  .cat-opt span{ line-height:1.2; }
  .cat-reset{ color: var(--red); font-weight:700; }

  section.block{ margin-top: 24px; }
  .block-title{ font-family:'Zen Maru Gothic', sans-serif; font-weight:700; font-size:16px; color: var(--ink); margin-bottom:6px; display:flex; align-items:center; gap:8px; }
  .block-sub{ font-size:12px; color: var(--ink-soft); margin-bottom:14px; line-height:1.6;}

  select.assign{ font-family:'Noto Sans JP', sans-serif; font-size:11.5px; border-radius:8px; border:1px solid var(--line); background: var(--paper-2); color: var(--text-ink); padding: 5px 4px; flex-shrink:0; margin-top:6px; }
  .cand-del{ background:none; border:none; color: var(--red); font-size:16px; cursor:pointer; padding:2px 4px; flex-shrink:0; margin-top:6px; }
  .cand-add{ display:flex; gap:6px; margin-top:6px; }
  .cand-add input{ flex:1; border-radius:8px; border:1px solid var(--line); padding:8px 9px; font-size:12.5px; }
  .cand-add button{ background: var(--teal); color:white; border:none; border-radius:8px; padding:8px 14px; font-weight:700; font-size:12.5px; cursor:pointer; }

  .packing{ background: var(--paper); color:var(--text-ink); border-radius:14px; padding: 14px; box-shadow: 0 5px 12px rgba(74,59,46,0.08); }
  .pack-item{ display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .pack-item:last-child{ border-bottom:none; }
  .pack-item span{ flex:1; }
  .pack-item input[type=checkbox]{ width:15px;height:15px; accent-color:var(--red); }
  .pack-add{ display:flex; gap:6px; margin-top:10px; }
  .pack-add input{ flex:1; border-radius:8px; border:1px solid var(--line); padding:7px 8px; font-size:12.5px; }
  .pack-add button{ background: var(--teal); color:white; border:none; border-radius:8px; padding: 7px 12px; font-weight:700; font-size:12.5px; cursor:pointer; }

  .foot{ text-align:center; margin-top: 26px; font-size:11px; color: var(--ink-soft); font-family:'Zen Maru Gothic', sans-serif; }
  .casino-card{ background: var(--paper); color:var(--text-ink); border-radius:14px; padding: 14px 16px; margin-bottom:10px; box-shadow: 0 5px 12px rgba(74,59,46,0.08); }
  .casino-h{ font-weight:700; font-size:13.5px; margin-bottom:8px; }
  .casino-list{ margin:0; padding-left:18px; font-size:12.5px; line-height:1.7; }
  .casino-list li{ margin-bottom:6px; }
  .casino-list li:last-child{ margin-bottom:0; }
  .casino-list a{ color: var(--teal); font-weight:700; text-decoration:none; font-size:11.5px; }
  .casino-list a:hover{ text-decoration:underline; }

  .expense-box{ background: var(--paper); color:var(--text-ink); border-radius:14px; padding:14px 16px; box-shadow: 0 5px 12px rgba(74,59,46,0.08); }
  .rate-row{ display:flex; align-items:center; gap:8px; font-size:12px; margin-bottom:12px; color: rgba(58,46,34,0.65); }
  .rate-row input{ width:70px; border:1px solid var(--line); border-radius:8px; padding:4px 6px; font-size:12px; }
  .receipt-upload{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .receipt-btn{ background: var(--red); color:white; border:none; border-radius:10px; padding: 9px 14px; font-weight:700; font-size:12.5px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }

<script>
function formatDateLabel(dt){
  const w = ['日','月','火','水','木','金','土'][dt.getDay()];
  return `${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日(${w})`;
}
function formatShortDate(dt){
  const w = ['SUN','MON','TUE','WED','THU','FRI','SAT'][dt.getDay()];
  const mm = String(dt.getMonth()+1).padStart(2,'0'), dd = String(dt.getDate()).padStart(2,'0');
  return `${dt.getFullYear()}.${mm}.${dd} ${w}`;
}
function buildDayDatesAndLabels(){
  const start = new Date(TRIP_CONFIG.startDate+'T00:00:00'+TRIP_CONFIG.timezoneOffset);
  const colors = ['red','teal','gold','sky'];
  const days = [];
  const dateMap = {};
  for(let i=0;i<TRIP_CONFIG.dayCount;i++){
    const dt = new Date(start.getTime() + i*86400000);
    const yyyy = dt.getFullYear(), mm = String(dt.getMonth()+1).padStart(2,'0'), dd = String(dt.getDate()).padStart(2,'0');
    days.push({ id:i+1, date: formatDateLabel(dt), color: colors[i%colors.length] });
    dateMap[i+1] = `${yyyy}${mm}${dd}`;
  }
  return {days, dateMap};
}

function getGreeting(){
  const h = new Date().getHours();
  if(h < 11) return 'おはようございます';
  if(h < 17) return 'こんにちは';
  return 'こんばんは';
}

function ensureSeedCandidates(tripId){
  const seedCands = TRIP_SEED_CANDIDATES[tripId];
  if(!seedCands) return;
  const existingIds = new Set(state.customItems.map(i=>i.id));
  seedCands.forEach(ci=>{ if(!existingIds.has(ci.id)) state.customItems.push({...ci}); });
}

async function activateTrip(tripId){
  const meta = TRIP_REGISTRY.find(t=>t.id===tripId);
  if(!meta) return;
  activeTripId = tripId;
  TRIP_CONFIG = meta;
  const built = buildDayDatesAndLabels();
  DAYS = built.days; DAY_DATES = built.dateMap;
  ITEMS = TRIP_SEED_ITEMS[tripId] || [];
  if(!TRIP_MUTABLES[tripId]){
    try{
      const result = await window.storage.get('tripmate-trip-'+tripId, true);
      TRIP_MUTABLES[tripId] = (result && result.value) ? Object.assign(defaultMutable(), JSON.parse(result.value)) : defaultMutable();
    }catch(err){
      TRIP_MUTABLES[tripId] = defaultMutable();
    }
  }
  state = TRIP_MUTABLES[tripId];
  ensureSeedCandidates(tripId);
  currentDay = 1;
  currentTab = 'home';
  appPhase = 'trip';
  renderRoot();
}

function goToTripList(){ appPhase = 'tripList'; renderRoot(); }

function renderRoot(){
  const nav = document.getElementById('bottomNav');
  const el = document.getElementById('screenContent');
  if(appPhase === 'trip'){
    nav.style.display = 'flex';
    renderApp();
  } else {
    nav.style.display = 'none';
    el.innerHTML = '';
    if(appPhase === 'splash') renderSplashScreen(el);
    else renderTripListScreen(el);
  }
}

function addDaysStr(yyyymmdd, n){
  const y = +yyyymmdd.slice(0,4), m = +yyyymmdd.slice(4,6)-1, d = +yyyymmdd.slice(6,8);
  const dt = new Date(Date.UTC(y,m,d));
  dt.setUTCDate(dt.getUTCDate()+n);
  const yy = dt.getUTCFullYear();
  const mm = String(dt.getUTCMonth()+1).padStart(2,'0');
  const dd = String(dt.getUTCDate()).padStart(2,'0');
  return `${yy}${mm}${dd}`;
}

function toTimeCode(t){
  if(t === '24:00') return {code:'000000', nextDay:true};
  return {code: (t||'00:00').replace(':','')+'00', nextDay:false};
}

function findItemById(id){
  return ITEMS.find(i=>i.id===id) || state.customItems.find(i=>i.id===id);
}

function getAllItemsForDay(day){
  return [...ITEMS.filter(i=>i.day===day), ...state.customItems.filter(i=>i.day===day)];
}

function getItemsForDay(day){
  const base = getAllItemsForDay(day).filter(i=>!state.deletedItems[i.id]);
  const order = state.dayOrder && state.dayOrder[day];
  if(!order || !order.length) return base;
  const map = {}; base.forEach(it=>map[it.id]=it);
  const ordered = order.map(id=>map[id]).filter(Boolean);
  base.forEach(it=>{ if(!order.includes(it.id)) ordered.push(it); });
  return ordered;
}

function getUnassignedItems(){
  return state.customItems.filter(i=>i.day===null && !state.deletedItems[i.id]);
}

function getDisplayTime(item){
  const ov = state.timeOverride[item.id];
  return { time: (ov && ov.time) || item.time, end: (ov && ov.end !== undefined) ? ov.end : item.end };
}

function getDisplayContent(item){
  const ed = state.itemEdits[item.id];
  return { title: (ed && ed.title) || item.title, note: (ed && ed.note !== undefined) ? ed.note : item.note };
}

function buildGCalUrl(item){
  const dt = getDisplayTime(item);
  const dc = getDisplayContent(item);
  const dayDate = DAY_DATES[item.day];
  let datesParam;
  if(dt.time === '終日'){
    datesParam = `${dayDate}/${addDaysStr(dayDate,1)}`;
  } else {
    const st = toTimeCode(dt.time);
    const startDate = st.nextDay ? addDaysStr(dayDate,1) : dayDate;
    let endDate, endCode;
    if(dt.end){
      const en = toTimeCode(dt.end);
      endDate = en.nextDay ? addDaysStr(dayDate,1) : dayDate;
      endCode = en.code;
    } else {
      const [hhStr, mmStr] = (dt.time||'12:00').split(':');
      let endH = (+hhStr) + 1;
      let ed = dayDate;
      if(endH >= 24){ endH -= 24; ed = addDaysStr(dayDate,1); }
      endDate = ed;
      endCode = String(endH).padStart(2,'0') + mmStr + '00';
    }
    datesParam = `${startDate}T${st.code}/${endDate}T${endCode}`;
  }
  const text = encodeURIComponent(`${item.icon} ${dc.title}`);
  const details = encodeURIComponent(dc.note || '');
  const location = encodeURIComponent(item.mapQuery || dc.title);
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${text}&dates=${datesParam}&details=${details}&location=${location}&ctz=Asia/Seoul`;
}

function haversine(lat1, lng1, lat2, lng2){
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLng = (lng2-lng1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function getEffectiveMapQuery(item){

function buildNaverDayUrl(items){
  const withQuery = items.find(it=>getEffectiveMapQuery(it));
  if(withQuery) return `https://map.naver.com/p/search/${encodeURIComponent(getEffectiveMapQuery(withQuery))}`;
  const withCoord = items.find(it=>it.lat && it.lng);

}

function getTripStatus(){
  const now = new Date();
  const tripStart = new Date(TRIP_CONFIG.startDate+'T00:00:00'+TRIP_CONFIG.timezoneOffset);
  const tripEnd = new Date(tripStart.getTime() + TRIP_CONFIG.dayCount*86400000);
  if(now < tripStart){
    const daysLeft = Math.max(1, Math.ceil((tripStart-now)/86400000));
    return { phase:'before', dayNum:1, label:`あと${daysLeft}日` };
  } else if(now < tripEnd){
    const diffDays = Math.floor((now-tripStart)/86400000);
    const dayNum = Math.min(TRIP_CONFIG.dayCount, diffDays+1);
    return { phase:'during', dayNum, label:`${getGreeting()}😊`, sublabel:`今日は${dayNum}日目です。` };
  }
  return { phase:'after', dayNum:TRIP_CONFIG.dayCount, label:'おかえりなさい✨', sublabel:'思い出を見返しますか？' };
}

function getNextItem(dayNum, duringTrip){
  const items = getItemsForDay(dayNum);
  if(!items.length) return null;
  if(duringTrip){
    const now = new Date();
    const nowHM = now.getHours()*60 + now.getMinutes();
    for(const it of items){
      const dt = getDisplayTime(it);
      if(dt.time === '終日' || !dt.time) continue;
      const [h,m] = dt.time.split(':').map(Number);
      if(h*60+m >= nowHM) return it;
    }
    return items[items.length-1];
  }
  return items[0];
}

      d.images.forEach(img=> photos.push({ img, title: dc.title, id: it.id }));

  return photos;
}

async function autoLookupPlace(title, destination){
  const query = destination ? `${title} ${destination}` : title;
  const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(query)}&addressdetails=1&extratags=1&limit=1&accept-language=ja`;
  const response = await fetch(url);
  if(!response.ok) throw new Error('nominatim request failed: ' + response.status);
  const results = await response.json();
  if(!results || !results.length) throw new Error('no results found');
  const r = results[0];
  const extratags = r.extratags || {};
  return {
    address: r.display_name || '',
    phone: extratags.phone || extratags['contact:phone'] || '',
    hours: extratags.opening_hours || '',
    website: extratags.website || extratags['contact:website'] || ''
  };
}

function openDetail(id){
  const item = findItemById(id);
  if(!item || state.deletedItems[id]) return;
  const overlay = document.getElementById('detailOverlay');
  const sheet = document.getElementById('detailSheet');
  sheet.innerHTML = buildDetailHtml(item);
  overlay.classList.add('open');

  document.getElementById('detailCloseBtn').addEventListener('click', closeDetail);

  document.getElementById('detailIconBtn').addEventListener('click', ()=>{
    const picker = document.getElementById('detailCatPicker');
    picker.style.display = picker.style.display==='grid' ? 'none' : 'grid';
  });
  sheet.querySelectorAll('[data-cat-pick]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      state.category[e.currentTarget.dataset.catPick] = e.currentTarget.dataset.catKey;
      scheduleSave();
      openDetail(id);
    });
  });
  const resetBtn = sheet.querySelector('[data-cat-reset]');
  if(resetBtn) resetBtn.addEventListener('click', e=>{
    delete state.category[e.currentTarget.dataset.catReset];
    scheduleSave();
    openDetail(id);
  });

  document.getElementById('detailCheckBtn').addEventListener('click', ()=>{
    state.checked[id] = !state.checked[id];
    scheduleSave();
    openDetail(id);
  });
  document.getElementById('detailConfirmBtn').addEventListener('click', ()=>{
    state.confirmed[id] = !state.confirmed[id];
    scheduleSave();
    openDetail(id);
  });

  const photoInput = document.getElementById('detailPhotoInput');
  if(photoInput){
    photoInput.addEventListener('change', async e=>{
      const file = e.target.files[0];
      if(!file) return;
      try{
        const base64 = await resizeImageFile(file, 720);
        const d = state.itemDetails[id] || {};
        d.images = d.images || [];
        d.images.push('data:image/jpeg;base64,'+base64);
        state.itemDetails[id] = d;
        scheduleSave();
        openDetail(id);
      }catch(err){ console.error('photo add failed', err); }
    });
  }
  sheet.querySelectorAll('[data-photo-del]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const d = state.itemDetails[id] || {};
      d.images = d.images || [];
      d.images.splice(+e.currentTarget.dataset.photoDel, 1);
      state.itemDetails[id] = d;
      scheduleSave();
      openDetail(id);
    });
  });

  const currentImages = (state.itemDetails[id] && state.itemDetails[id].images) || [];
  sheet.querySelectorAll('.detail-photo-item img').forEach((img, idx)=>{
    img.addEventListener('click', e=>{
      e.stopPropagation();
      openLightbox(currentImages, idx);
    });
  });
  let pagerIdx = 0;
  const pagerImgEl = document.getElementById('pagerImg');
  const pagerCountEl = document.getElementById('pagerCount');
  function updatePager(){
    if(!pagerImgEl) return;
    pagerImgEl.src = currentImages[pagerIdx];
    if(pagerCountEl) pagerCountEl.textContent = `${pagerIdx+1}/${currentImages.length}`;
  }
  const pagerPrevBtn = document.getElementById('pagerPrev');
  const pagerNextBtn = document.getElementById('pagerNext');
  if(pagerPrevBtn) pagerPrevBtn.addEventListener('click', e=>{ e.stopPropagation(); pagerIdx = (pagerIdx-1+currentImages.length)%currentImages.length; updatePager(); });
  if(pagerNextBtn) pagerNextBtn.addEventListener('click', e=>{ e.stopPropagation(); pagerIdx = (pagerIdx+1)%currentImages.length; updatePager(); });
  if(pagerImgEl) pagerImgEl.addEventListener('click', ()=> openLightbox(currentImages, pagerIdx));

  sheet.querySelectorAll('[data-shop-idx]').forEach(cb=>{
    cb.addEventListener('change', e=>{
      const d = state.itemDetails[id] || {}; d.shoppingList = d.shoppingList || [];
      d.shoppingList[+e.target.dataset.shopIdx].done = e.target.checked;
      state.itemDetails[id] = d;
      scheduleSave();
    });
  });
  sheet.querySelectorAll('[data-shop-del]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const d = state.itemDetails[id] || {}; d.shoppingList = d.shoppingList || [];
      d.shoppingList.splice(+e.currentTarget.dataset.shopDel, 1);
      state.itemDetails[id] = d;
      scheduleSave();
      openDetail(id);
    });
  });
  const shopAddBtn = document.getElementById('detailShopAddBtn');
  if(shopAddBtn){
    shopAddBtn.addEventListener('click', ()=>{
      const inp = document.getElementById('detailShopInput');
      if(inp.value.trim()){
        const d = state.itemDetails[id] || {}; d.shoppingList = d.shoppingList || [];
        d.shoppingList.push({text: inp.value.trim(), done:false});
        state.itemDetails[id] = d;
        scheduleSave();
        openDetail(id);
      }
    });
  }

  const lookupBtn = document.getElementById('detailLookupBtn');
  if(lookupBtn){
    lookupBtn.addEventListener('click', async ()=>{
      const titleEl = document.getElementById('detailEditTitle');
      const titleVal = titleEl ? titleEl.value.trim() : '';
      const statusEl = document.getElementById('detailLookupStatus');
      if(!titleVal){
        statusEl.textContent = 'タイトルを入力してください';
        return;
      }
      statusEl.textContent = '検索中…';
      lookupBtn.disabled = true;
      try{
        const result = await autoLookupPlace(titleVal, TRIP_CONFIG.destination || '');
        const addrEl = document.getElementById('detailField_address');
        const phoneEl = document.getElementById('detailField_phone');
        const hoursEl = document.getElementById('detailField_hours');
        const webEl = document.getElementById('detailField_website');
        if(addrEl && result.address) addrEl.value = result.address;
        if(phoneEl && result.phone) phoneEl.value = result.phone;
        if(hoursEl && result.hours) hoursEl.value = result.hours;
        if(webEl && result.website) webEl.value = result.website;
        statusEl.textContent = '✓ 見つかった情報を入力しました（「完了して保存」を押してください）';
      }catch(err){
        console.error('lookup failed', err);
        statusEl.textContent = '見つかりませんでした。手入力してください';
      }
      lookupBtn.disabled = false;
    });
  }

  document.getElementById('detailEditToggle').addEventListener('click', ()=>{
    const coreDisp = document.getElementById('detailCoreDisplay');
    const coreEdit = document.getElementById('detailCoreEdit');
    const infoDisp = document.getElementById('detailInfoDisplay');
    const infoEdit = document.getElementById('detailInfoEdit');
    const photoDisp = document.getElementById('detailPhotosDisplay');
    const photoEdit = document.getElementById('detailPhotosEdit');
    const btn = document.getElementById('detailEditToggle');
    const editing = coreEdit.style.display === 'flex';
    if(!editing){
      coreDisp.style.display = 'none'; coreEdit.style.display = 'flex';
      infoDisp.style.display = 'none'; infoEdit.style.display = 'flex';
      photoDisp.style.display = 'none'; photoEdit.style.display = 'flex';
      btn.textContent = '✓ 完了して保存';
      autoGrow(document.getElementById('detailMemo'));
    } else {
      commitDetailEdits(id, item);
      scheduleSave();
      openDetail(id);
    }
  });

  document.getElementById('detailDeleteBtn').addEventListener('click', ()=>{
    if(confirm('この予定を削除しますか？')){
      state.deletedItems[id] = true;
      scheduleSave();
      closeDetail();
      renderApp();
    }
  });
}

function closeDetail(){
  document.getElementById('detailOverlay').classList.remove('open');
}

let lightboxImages = [];
let lightboxIndex = 0;
function renderLightbox(){
  document.getElementById('lightboxImg').src = lightboxImages[lightboxIndex] || '';
  document.getElementById('lightboxNav').style.display = lightboxImages.length > 1 ? 'flex' : 'none';
}
function openLightbox(images, index){
  lightboxImages = images;
  lightboxIndex = index;
  renderLightbox();
  document.getElementById('photoLightbox').classList.add('open');
}
function closeLightbox(){
  document.getElementById('photoLightbox').classList.remove('open');
}

// ---------------- ホーム ----------------
function renderHomeScreen(container){
  const info = getTripStatus();
  const tripStart = new Date(TRIP_CONFIG.startDate+'T00:00:00'+TRIP_CONFIG.timezoneOffset);
  const tripLastDay = new Date(tripStart.getTime() + (TRIP_CONFIG.dayCount-1)*86400000);
  const hero = document.createElement('header');
  hero.className = 'home-hero phase-'+info.phase;
  hero.innerHTML = `
    <div class="hero-badge">${heroBadgeSvg()}</div>
    <div class="eyebrow">${TRIP_CONFIG.subtitle || 'TripMate'}</div>
    <h1 class="title">${TRIP_CONFIG.title}<br><span class="accent">${TRIP_CONFIG.destination}</span>旅行</h1>
    <div class="dates">${formatShortDate(tripStart)} — ${formatShortDate(tripLastDay)} · UTC${TRIP_CONFIG.timezoneOffset}</div>
    <div class="countdown-pill ${info.phase==='after' ? 'clickable' : ''}" id="countdownPill">${info.label}${info.sublabel ? `<div class="countdown-sub">${info.sublabel}</div>` : ''}</div>
  `;
  container.appendChild(hero);
  if(info.phase==='after'){
    const pillEl = hero.querySelector('#countdownPill');
    if(pillEl) pillEl.addEventListener('click', ()=>{
      const album = container.querySelector('#homeAlbumCard');
      if(album) album.scrollIntoView({behavior:'smooth', block:'start'});
    });
  }

  const photos = collectAllPhotos();
  if(info.phase==='after' && photos.length){
    const albumCard = document.createElement('div');
    albumCard.className = 'home-card';
    albumCard.id = 'homeAlbumCard';
    albumCard.innerHTML = `
      <div class="home-card-head"><span>🖼 思い出アルバム</span><span style="font-size:11px;color:var(--ink-soft);">${photos.length}枚</span></div>
      <div class="detail-photos">
        ${photos.map(p=>`<div class="detail-photo-item clickable" data-detail-open="${p.id}"><img src="${p.img}"></div>`).join('')}
      </div>
    `;
    container.appendChild(albumCard);
    albumCard.querySelectorAll('[data-detail-open]').forEach(el=> el.addEventListener('click', e=> openDetail(e.currentTarget.dataset.detailOpen)));
  }

  const previewItems = getItemsForDay(info.dayNum).slice(0,4);
  const todayCard = document.createElement('div');
  todayCard.className = 'home-card';
  todayCard.innerHTML = `
    <div class="home-card-head"><span>📅 ${info.dayNum}日目の予定</span><button type="button" class="link-btn" id="seeAllBtn">すべて見る ›</button></div>
    <div class="mini-timeline">
      ${previewItems.map(it=>{
        const dc = getDisplayContent(it);
        const dt = getDisplayTime(it);
        return `<div class="mini-row clickable" data-detail-open="${it.id}"><div class="mini-dot"></div><div class="mini-time">${dt.time}</div><div class="mini-title">${it.icon} ${dc.title}</div></div>`;
      }).join('') || '<div style="font-size:12px;color:var(--ink-soft);">予定がまだありません</div>'}
    </div>
  `;
  container.appendChild(todayCard);
  todayCard.querySelector('#seeAllBtn').addEventListener('click', ()=>{ currentDay = info.dayNum; setTab('itinerary'); });
  todayCard.querySelectorAll('[data-detail-open]').forEach(el=>{
    el.addEventListener('click', e=> openDetail(e.currentTarget.dataset.detailOpen));
  });

  const next = getNextItem(info.dayNum, info.phase==='during');
  if(next){
    const dc = getDisplayContent(next);
    const dt = getDisplayTime(next);
    const nextCard = document.createElement('div');
    nextCard.className = 'home-card';
    nextCard.innerHTML = `
      <div class="home-card-head"><span>📍 次の予定</span></div>
      <div class="next-dest">
        <div class="next-info clickable" data-detail-open="${next.id}">
          <div class="next-name">${next.icon} ${dc.title}</div>
          <div class="next-time">${dt.time}${dt.end ? '〜'+dt.end : ''}</div>
        </div>
        ${next.mapQuery ? `<a class="nav-start-btn" href="https://map.naver.com/p/search/${encodeURIComponent(next.mapQuery)}" target="_blank" rel="noopener">🧭 ナビ開始</a>` : ''}
      </div>
    `;
    container.appendChild(nextCard);
    nextCard.querySelectorAll('[data-detail-open]').forEach(el=>{
      el.addEventListener('click', e=> openDetail(e.currentTarget.dataset.detailOpen));
    });
  }

  const quickGrid = document.createElement('div');
  quickGrid.className = 'quick-grid';
  quickGrid.innerHTML = `
    <button type="button" class="quick-btn" data-quick="itinerary">🗓<span>旅程</span></button>
    <button type="button" class="quick-btn" data-quick="list-packing">🧳<span>持ち物</span></button>
    <button type="button" class="quick-btn" data-quick="list-expense">💴<span>予算</span></button>
    <button type="button" class="quick-btn" data-quick="other">🎰<span>お役立ち情報</span></button>
  `;
  container.appendChild(quickGrid);
  quickGrid.querySelectorAll('[data-quick]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const v = e.currentTarget.dataset.quick;
      if(v==='itinerary'){ currentDay = info.dayNum; setTab('itinerary'); }
      else if(v==='list-packing'){ currentListTab='packing'; setTab('list'); }
      else if(v==='list-expense'){ currentListTab='expense'; setTab('list'); }
      else if(v==='other'){ otherAccordion.casino = true; setTab('other'); }
    });
  });
}

// ---------------- 旅程 ----------------
function renderStampsInto(el){
  el.innerHTML = '';
  DAYS.forEach(d=>{
    const b = document.createElement('button');
    b.className = 'stamp' + (d.id===currentDay ? ' active':'');
    b.dataset.c = d.color;
    b.textContent = d.id;
    b.onclick = ()=>{ currentDay = d.id; renderApp(); };
    el.appendChild(b);
  });
}

function renderItineraryScreen(container){
  const d = DAYS.find(x=>x.id===currentDay);
  const items = getItemsForDay(currentDay);

  const title = document.createElement('div');
  title.className = 'screen-title';
  title.textContent = '🗓 旅程';
  container.appendChild(title);

  const stampWrap = document.createElement('div');
  stampWrap.className = 'stamp-row';
  container.appendChild(stampWrap);
  renderStampsInto(stampWrap);

  const heading = document.createElement('div');
  heading.className = 'day-heading';
  heading.innerHTML = d ? `<div class="d-label">DAY ${d.id}</div><div class="d-date">${d.date}</div>` : '';
  container.appendChild(heading);

  const navTip = document.createElement('div');
  navTip.className = 'nav-tip';
  navTip.innerHTML = '⠿を掴んで並び替え。時刻をタップして変更。タイトルをタップすると詳細(編集・削除・種類変更・写真など)が開きます。';
  container.appendChild(navTip);

  const ticketsContainer = document.createElement('div');
  ticketsContainer.id = 'ticketsContainer';
  container.appendChild(ticketsContainer);

  items.forEach(it=>{
    const isChecked = !!state.checked[it.id];
    const dTime = getDisplayTime(it);
    const dc = getDisplayContent(it);
    const catKey = state.category[it.id];
    const iconHtml = catKey ? catIconHtml(catKey, 38) : `<span class="t-icon-emoji" style="width:38px;height:38px;font-size:19px;">${it.icon}</span>`;
    const row = document.createElement('div');
    row.className = 'ticket-compact' + (isChecked ? ' done' : '');
    row.dataset.itemId = it.id;
    row.innerHTML = `
      <div class="drag-handle" title="ドラッグで並び替え">${gripIcon()}</div>
      <div class="tc-time" data-time-id="${it.id}">${dTime.time}${dTime.end ? `<span class="tc-time-end">〜${dTime.end}</span>` : ''}</div>
      <button type="button" class="tc-icon-btn" data-detail-open="${it.id}">${iconHtml}</button>
      <div class="tc-body" data-detail-open="${it.id}">
        <div class="tc-title">${dc.title}</div>
        ${dc.note ? `<div class="tc-note">${dc.note}</div>` : ''}
        ${it.risk ? `<div class="risk">⚠ ${it.risk}</div>` : ''}
        ${it.tip ? `<div class="tip">💡 <span>${it.tip}</span></div>` : ''}
        ${it.drama ? `<div class="drama">🎬 <span>${it.drama}</span></div>` : ''}
        ${it.snack ? `<div class="snack">🍔 <span>${it.snack}</span></div>` : ''}
        ${it.transit ? `<div class="transit">🚉 <span>${it.transit}</span></div>` : ''}
      </div>
      <div class="tc-chev" data-detail-open="${it.id}">›</div>
    `;
    ticketsContainer.appendChild(row);
  });

  container.querySelectorAll('[data-detail-open]').forEach(el=>{
    el.addEventListener('click', e=> openDetail(e.currentTarget.dataset.detailOpen));
  });

  container.querySelectorAll('.tc-time[data-time-id]').forEach(el=>{
    const id = el.dataset.timeId;
    const it = items.find(x=>x.id===id);
    const dt = getDisplayTime(it);
    if(dt.time === '終日') return;
    el.classList.add('clickable');
    el.addEventListener('click', e=>{ e.stopPropagation(); openTimeEditor(el, it); });
  });

  const addWrap = document.createElement('div');
  addWrap.className = 'add-item-wrap';
  addWrap.innerHTML = `
    <button type="button" class="add-item-btn" id="addItemBtn">＋ 予定を追加</button>
    <div class="add-item-form" id="addItemForm" style="display:none;">
      <input type="time" id="newItemTime" value="12:00">
      <input type="text" id="newItemTitle" placeholder="行き先・予定名">
      <textarea id="newItemNote" placeholder="メモ(任意)"></textarea>
      <div class="add-item-actions">
        <button type="button" class="add-item-cancel" id="addItemCancel">キャンセル</button>
        <button type="button" class="add-item-save" id="addItemSave">追加する</button>
      </div>
    </div>
  `;
  container.appendChild(addWrap);
  document.getElementById('addItemBtn').addEventListener('click', ()=>{
    document.getElementById('addItemForm').style.display = 'flex';
    document.getElementById('addItemBtn').style.display = 'none';
  });
  document.getElementById('addItemCancel').addEventListener('click', ()=> renderApp());
  document.getElementById('addItemSave').addEventListener('click', ()=>{
    const timeVal = document.getElementById('newItemTime').value || '12:00';
    const titleVal = document.getElementById('newItemTitle').value.trim();
    const noteVal = document.getElementById('newItemNote').value.trim();
    if(!titleVal) return;
    state.customItems.push({ id:'custom-'+Date.now(), day: currentDay, time: timeVal, end:'', icon:'📍', title: titleVal, note: noteVal });
    scheduleSave();
    renderApp();
  });

  if(sortableInstance){ sortableInstance.destroy(); sortableInstance = null; }
  if(window.Sortable){
    sortableInstance = new Sortable(ticketsContainer, {
      handle: '.drag-handle',
      animation: 180,
      onEnd: ()=>{
        const newOrder = Array.from(ticketsContainer.children).map(el=>el.dataset.itemId);
        state.dayOrder[currentDay] = newOrder;
        scheduleSave();
        renderApp();
      }
    });
  }
}

  container.appendChild(heading);

  container.appendChild(navTip);

    const dc = getDisplayContent(it);
    const catKey = state.category[it.id];
    const iconHtml = catKey ? catIconHtml(catKey, 30) : `<span class="t-icon-emoji">${it.icon}</span>`;
    const q = getEffectiveMapQuery(it);
    const label = orderMap[it.id] ? `${orderMap[it.id]}. ` : '📍 ';

  spotsList.querySelectorAll('[data-detail-open]').forEach(el=>{
    el.addEventListener('click', e=> openDetail(e.currentTarget.dataset.detailOpen));
  });

  drawMap(items);
}

function drawMap(items){
  const pts = items.filter(it=>it.lat && it.lng);
  const mapEl = document.getElementById('leafletMap');
  if(!mapEl || pts.length === 0) return;

  if(leafletInstance){ leafletInstance.remove(); leafletInstance = null; }

  leafletInstance = L.map('leafletMap', {zoomControl:true, attributionControl:false});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(leafletInstance);

  const latlngs = [];
  let order = 0;
  pts.forEach(it=>{
    order++;
    const dc = getDisplayContent(it);
    const icon = L.divIcon({
      className: '',
      html: `<div style="background:#E1795A;color:white;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Zen Maru Gothic',sans-serif;font-size:11px;font-weight:700;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3);">${order}</div>`,
      iconSize: [24,24], iconAnchor:[12,12]
    });
    L.marker([it.lat, it.lng], {icon}).addTo(leafletInstance)
      .bindPopup(`<b>${order}. ${dc.title}</b><br>${getDisplayTime(it).time}`);
    latlngs.push([it.lat, it.lng]);
  });

  if(latlngs.length > 1){
    L.polyline(latlngs, {color:'#4CA893', weight:3, dashArray:'6,6', opacity:0.85}).addTo(leafletInstance);
  }
  if(latlngs.length === 1){
    leafletInstance.setView(latlngs[0], 13);
  } else if(latlngs.length > 1) {
    leafletInstance.fitBounds(latlngs, {padding:[24,24]});
  }
}

        <div class="rate-row">💱 為替レート：1ウォン=<input type="number" id="rateInput" step="0.0001" /> 円　<span style="font-size:10.5px;">(目安。変わったら書き換えてOK)</span></div>
        <div class="receipt-upload">
          <label class="receipt-btn">📷 レシートを撮る/選ぶ<input type="file" accept="image/*" capture="environment" id="receiptInput" style="display:none;"></label>
          <span class="receipt-status" id="receiptStatus"></span>
        </div>
        <div class="exp-manual">
          <input type="text" class="store" id="manStore" placeholder="店名(手入力)">
          <input type="number" class="amt" id="manAmt" placeholder="金額(₩)">
          <button id="manAddBtn">追加</button>
        </div>
        <div id="expList"></div>
        <div class="exp-total" id="expTotal"></div>
      </div>`;
    renderExpenses();
    attachExpenseHandlers();
  } else {
    body.innerHTML = `<div class="block-sub">食事だけでなく行き先やお店も自由に追加できます。アイコンをタップすると詳細画面(種類・写真・住所など)を編集でき、日程を選ぶと旅程にそのまま反映されます。</div><div id="candList"></div>`;
    renderCandidates();
  }
}

function renderCandidates(){
  const list = document.getElementById('candList');
  if(!list) return;
  list.innerHTML = '';
  const items = getUnassignedItems();
  items.forEach(it=>{
    const dc = getDisplayContent(it);
    const catKey = state.category[it.id];
    const iconHtml = catKey ? catIconHtml(catKey, 36) : `<span class="t-icon-emoji" style="width:36px;height:36px;">${it.icon}</span>`;
    const row = document.createElement('div');
    row.className = 'ticket-compact';
    row.innerHTML = `
      <button type="button" class="tc-icon-btn" data-detail-open="${it.id}">${iconHtml}</button>
      <div class="tc-body" data-detail-open="${it.id}">
        <div class="tc-title">${dc.title}</div>
        ${dc.note ? `<div class="tc-note">${dc.note}</div>` : ''}
      </div>
      <select class="assign" data-assign="${it.id}">
        <option value="">未定</option>
        ${DAYS.map(d=>`<option value="${d.id}">${d.id}日目</option>`).join('')}
      </select>
      <button type="button" class="cand-del" data-cand-del="${it.id}">✕</button>
    `;
    list.appendChild(row);
  });

  const addRow = document.createElement('div');
  addRow.className = 'cand-add';
  addRow.innerHTML = `<input type="text" id="candInput" placeholder="行き先・お店の名前を追加..."/><button id="candAddBtn">追加</button>`;
  list.appendChild(addRow);

  list.querySelectorAll('[data-detail-open]').forEach(el=>{
    el.addEventListener('click', e=> openDetail(e.currentTarget.dataset.detailOpen));
  });
  list.querySelectorAll('select[data-assign]').forEach(sel=>{
    sel.addEventListener('change', e=>{
      const id = e.target.dataset.assign;
      const item = state.customItems.find(i=>i.id===id);
      if(!item) return;
      const val = e.target.value;
      item.day = val ? Number(val) : null;
      if(item.day && !item.time) item.time = '12:00';
      scheduleSave();
      renderApp();
    });
  });
  list.querySelectorAll('[data-cand-del]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      state.deletedItems[e.currentTarget.dataset.candDel] = true;
      scheduleSave();
      renderCandidates();
    });
  });
  document.getElementById('candAddBtn').addEventListener('click', ()=>{
    const inp = document.getElementById('candInput');
    if(inp.value.trim()){
      state.customItems.push({ id:'cand-'+Date.now(), day:null, time:'', end:'', icon:'📍', title:inp.value.trim(), note:'' });
      scheduleSave();
      renderCandidates();
    }
  });
}

  }

  if(!list) return;

    list.innerHTML = '<div style="font-size:12px;color:rgba(58,46,34,0.4);padding:6px 0;">まだ記録がありません</div>';
  }

  state.expenses.forEach((ex, idx)=>{
    totalKrw += ex.krw;

    const row = document.createElement('div');
    row.className = 'exp-row';

      <div class="exp-day">Day${ex.day}</div>

      scheduleSave();
      renderExpenses();

  });
}

function resizeImageFile(file, maxDim){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
        resolve(dataUrl.split(',')[1]);
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function extractReceipt(base64Image){
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 300,
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: "image/jpeg", data: base64Image } },
          { type: "text", text: "これは韓国のレシートまたは領収書の画像です。店名(store)と合計金額(krw、ウォンの数値のみ、カンマなし整数)を読み取り、次のJSON形式のみで返してください。説明文やコードブロックの記号は一切つけないでください。\n{\"store\":\"店名\",\"krw\":1234}\n読み取れない項目があれば store は \"不明\"、krw は 0 としてください。" }
        ]
      }]
    })
  });
  const data = await response.json();
  const text = (data.content || []).map(b => b.text || '').join('');
  const clean = text.replace(/```json|```/g, '').trim();
  return JSON.parse(clean);
}

function setReceiptStatus(msg){
  const el = document.getElementById('receiptStatus');
  if(el) el.textContent = msg;
}

function attachExpenseHandlers(){
  const rateInput = document.getElementById('rateInput');
  if(rateInput){
    rateInput.value = state.exchangeRate;
    rateInput.addEventListener('change', e=>{
      const v = parseFloat(e.target.value);
      if(!isNaN(v) && v > 0){
        state.exchangeRate = v;
        scheduleSave();
        renderExpenses();
      }
    });
  }
  const receiptInput = document.getElementById('receiptInput');
  if(receiptInput){
    receiptInput.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      setReceiptStatus('画像を読み取り中…');
      try{
        const base64 = await resizeImageFile(file, 1000);
        const result = await extractReceipt(base64);
        const krw = Number(result.krw) || 0;
        state.expenses.push({ day: currentDay, store: result.store || '不明', krw, ts: Date.now() });
        scheduleSave();
        renderExpenses();
        setReceiptStatus(krw > 0 ? `✓ ${result.store} ／ ₩${krw.toLocaleString()} を記録しました` : '金額を読み取れませんでした。下から手入力してください');
      }catch(err){
        console.error('receipt read failed', err);
        setReceiptStatus('読み取りに失敗しました。下から手入力してください');
      }
      e.target.value = '';
    });
  }
  const manAddBtn = document.getElementById('manAddBtn');
  if(manAddBtn){
    manAddBtn.addEventListener('click', ()=>{
      const storeEl = document.getElementById('manStore');
      const amtEl = document.getElementById('manAmt');
      const krw = Number(amtEl.value);
      if(storeEl.value.trim() && krw > 0){
        state.expenses.push({ day: currentDay, store: storeEl.value.trim(), krw, ts: Date.now() });
        scheduleSave();
        renderExpenses();
        storeEl.value = ''; amtEl.value = '';
      }
    });
  }
}

async function storageSetWithRetry(key, value, retries){
  for(let i=0;i<=retries;i++){
    try{
      const result = await window.storage.set(key, value, true);
      if(result) return result;
    }catch(err){
      if(i === retries) throw err;
      await new Promise(r=>setTimeout(r, 350*(i+1)));
    }
  }
  return null;
}

async function saveRegistry(){
  try{
    await storageSetWithRetry('tripmate-registry', JSON.stringify(TRIP_REGISTRY), 2);
  }catch(err){
    console.error('registry save failed', err);
  }
}

async function saveState(){
  try{
    await saveRegistry();
    if(activeTripId){
      const result = await storageSetWithRetry('tripmate-trip-'+activeTripId, JSON.stringify(state), 2);
      if(result){
        lastSavedLabel = new Date().toLocaleString('ja-JP', {hour:'2-digit', minute:'2-digit', month:'numeric', day:'numeric'});
        const el = document.getElementById('lastSaved');
        if(el) el.textContent = lastSavedLabel;
      }
    }
  }catch(err){
    console.error('save failed', err);
  }
}

async function migrateFromCombinedBlob(){
  try{
    const result = await window.storage.get('tripmate-app-data', true);
    if(result && result.value){
      const loaded = JSON.parse(result.value);
      if(loaded.registry && loaded.registry.length) TRIP_REGISTRY = loaded.registry;
      if(loaded.mutables){
        Object.keys(loaded.mutables).forEach(tid=>{
          TRIP_MUTABLES[tid] = Object.assign(defaultMutable(), loaded.mutables[tid]);
        });
      }
      return true;
    }
  }catch(err){ /* no combined blob, fine */ }
  return false;
}

async function migrateFromLegacySingle(){
  try{
    const old = await window.storage.get('trip-state', true);
    if(old && old.value){
      TRIP_MUTABLES['korea-2026'] = Object.assign(defaultMutable(), JSON.parse(old.value));
      return true;
    }
  }catch(err){ /* no legacy state, fine */ }
  return false;
}

async function loadState(){
  try{
    const regResult = await window.storage.get('tripmate-registry', true);
    if(regResult && regResult.value){
      const loadedReg = JSON.parse(regResult.value);
      if(loadedReg && loadedReg.length) TRIP_REGISTRY = loadedReg;
    } else {
      const migrated = await migrateFromCombinedBlob();
      if(!migrated) await migrateFromLegacySingle();
      await saveRegistry();
    }
  }catch(err){
    const migrated = await migrateFromCombinedBlob();
    if(!migrated) await migrateFromLegacySingle();
  }
  appPhase = 'splash';
  renderRoot();
}

loadState();
